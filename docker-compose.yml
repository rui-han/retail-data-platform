services:
  # =========================
  # Object Storage (S3-compatible)
  # =========================
  minio:
    image: minio/minio
    container_name: minio
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO Web UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

  # =========================
  # Apache Spark (Standalone Master)
  # =========================
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark
    working_dir: /opt/spark/work-dir

    # Inject S3 / Kaggle credentials from the local .env file so
    # spark-submit jobs pick them up without any manual export.
    env_file: .env

    volumes:
      - .:/opt/spark/work-dir
      - ./ivy:/home/spark/.ivy2

    environment:
      - PYTHONPATH=$PYTHONPATH:/opt/spark/work-dir

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"
