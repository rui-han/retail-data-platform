services:
  # =========================
  # Object Storage (S3-compatible)
  # =========================
  minio:
    image: minio/minio
    container_name: minio
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO Web UI
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"

  # =========================
  # Apache Spark
  # =========================
  # Runs in local[*] mode — all cores on this machine, no cluster overhead.
  # Appropriate for development and mid-size datasets (Olist is ~3 M rows).
  #
  # To scale horizontally, replace local[*] with a proper master/worker setup:
  #   1. Change the command below to start a Spark master process.
  #   2. Add a spark-worker service pointing at spark://spark:7077.
  #   3. Pass --master spark://spark:7077 to every spark-submit call.
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark
    working_dir: /opt/spark/work-dir
    env_file: .env
    volumes:
      - .:/opt/spark/work-dir
      - ./ivy:/home/spark/.ivy2
    environment:
      - PYTHONPATH=$PYTHONPATH:/opt/spark/work-dir
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"